name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libssl-dev libx11-dev python3

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: make test
